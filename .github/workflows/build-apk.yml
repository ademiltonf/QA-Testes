name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # O servidor do GitHub já vem com o Android SDK (ANDROID_HOME)
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Conferir senha da assinatura
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error title=Falta a senha::Crie o segredo SIGNING_PASSWORD em Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Compilar APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if ! gradle assemblePlayerRelease assembleProRelease --no-daemon > build.log 2>&1; then
            msg=$(grep -E "^e: |error:|ERROR|What went wrong|^> " build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falha na compilação::$msg"
            tail -80 build.log
            exit 1
          fi
          cp app/build/outputs/apk/player/release/app-player-release.apk OXEIPTVPLAYER.apk
          cp app/build/outputs/apk/pro/release/app-pro-release.apk OXEIPTVPRO.apk

      - uses: actions/upload-artifact@v5
        with:
          name: OXEIPTVPLAYER-apk
          path: OXEIPTVPLAYER.apk

      - uses: actions/upload-artifact@v5
        with:
          name: OXEIPTVPRO-apk
          path: OXEIPTVPRO.apk
